  OBSERVATION_FAMILY_SEMANTIC: provider-observation family definition; never C1 canonical identity
  SEMANTIC_FEATURE: atomic provider-side capability semantic feature; not health/quality/routing
  PROVIDER_NATIVE_IDENTIFIER_NAMESPACE: provider-side identifier namespace semantics; not canonical C1
    identity
  PROVIDER_NATIVE_SUBJECT_SEMANTIC: provider-side subject/object category semantics; not canonical C1
    class
  RECORD_GROUPING_SEMANTIC: provider response record/row/event grouping meaning
  PROVIDER_NATIVE_DEFAULTING_SEMANTIC: provider query omission/default behavior; request semantics only
