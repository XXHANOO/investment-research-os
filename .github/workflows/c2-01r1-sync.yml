name: C2.01R1 exact archive reconstruction

on:
  push:
    paths:
      - '.c2-01r1-sync/**'
      - '.github/workflows/c2-01r1-sync.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact repair archive
        shell: bash
        run: |
          set -euo pipefail
          cat .c2-01r1-sync/part*.b64 | base64 -d > /tmp/C2_01R1_SYNC_BUNDLE.tar.gz
          echo 'dbee27615e79a1fd6a20daeb29ad5f1ba96cb137fe767890c6631a543890c851  /tmp/C2_01R1_SYNC_BUNDLE.tar.gz' | sha256sum -c -
          mkdir -p governance/C2/C2.01R1
          tar -xzf /tmp/C2_01R1_SYNC_BUNDLE.tar.gz -C governance/C2/C2.01R1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, sys
          root = Path('governance/C2/C2.01R1')
          failures=[]
          for p in root.iterdir():
              if not p.is_file():
                  continue
              m=re.search(r'__sha256_([0-9a-f]{64})',p.name)
              if m:
                  got=hashlib.sha256(p.read_bytes()).hexdigest()
                  if got != m.group(1): failures.append((p.name,m.group(1),got))
          if failures:
              print(failures)
              sys.exit(1)
          print('content-addressed artifacts verified')
          PY
          grep -q '^8c572c6bdf8f2ff318a39008a44860a05b0d745c65fc7790b6d56a62f11a1e59  C2_01R1_INDEPENDENT_CAPABILITY_RECHECK_PACKAGE.zip$' governance/C2/C2.01R1/C2_01R1_INDEPENDENT_CAPABILITY_RECHECK_PACKAGE_ZIP_SHA256.txt
          rm -rf .c2-01r1-sync
          rm -f .github/workflows/c2-01r1-sync.yml
          git config user.name 'XXHANOO'
          git config user.email 'stevexie.0ah@outlook.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'governance(C2.01R1): archive scoped repair candidate'
          git push origin HEAD:main
