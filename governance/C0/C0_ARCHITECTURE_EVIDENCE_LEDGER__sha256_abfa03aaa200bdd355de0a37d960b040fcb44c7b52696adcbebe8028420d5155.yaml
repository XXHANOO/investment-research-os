schema_contract:
  required_decision_fields:
  - decision_id
  - statement
  - decision_classification
  - strongest_evidence_strength
  - reasoning_basis
  - evidence_refs
  - our_adaptation
  - risks
  - required_tests
  strength_null_rule: strongest_evidence_strength may be null only when external evidence_refs is empty; null is not evidence.
  source_ref_rule: every evidence_ref resolves to source_catalog; repository evidence pins repository+commit+exact path+blob_sha.
  remote_pin_rule: C0-060 resolves repository+commit+path against the remote repository and compares the returned blob identity
    to blob_sha.
  source_role_rule: source_role is independent of evidence strength and limits authority scope.
  bidirectional_test_coverage_rule: Every Ledger required_test must resolve to C0_ACCEPTANCE_TEST_CATALOG.md, and every C0
    acceptance obligation must be referenced by at least one Ledger decision before freeze.
notes:
- Decision classification describes OUR architecture decision, not the source itself.
- Freeze status is separate from VERIFIED/ADAPTED/INFERRED/ASPIRATIONAL classification.
- INFERRED critical decisions are allowed only when stated honestly and covered by explicit tests.
- Source role/authority scope is independent of evidence strength; code-level evidence from an INSPIRATION source does not
  grant Contract Authority.
- Unpinned Nautilus placeholder evidence remains excluded from the load-bearing machine Ledger until an exact source-level
  re-pin is performed.
- Fincept architecture evidence is pinned specifically to docs/ARCHITECTURE.md at commit cc342e... with remote blob 030e5847...
  and is used only within that file's authority scope.
- 'FR2 restoration note: this Ledger was reconstructed from the active older Ledger plus the validated R2V.1/R2V.2 stage specifications
  and FR1 17/17 remote source manifest. It intentionally receives a NEW SHA-256 rather than pretending to recover the historical
  6d8314... bytes.'
