execution_contract:
  schema_vector_execution: 'Validate instance against #/$defs/<schema_def>; compare
    boolean to expected.valid.'
  semantic_vector_execution: Future independent contract harness evaluates the named
    inherited/new semantic rule; this file defines expected outcome but is not production
    domain implementation.
  production_implementation_included: false
  r1_gate: STOP_AT_C1_06R1_INDEPENDENT_REGRESSION_RECHECK
base_c1_06_suite:
  range: C1-338..C1-430
  policy: PRESERVED_FROM_C1_06
base_c1_06r1_suite:
  range: C1-431..C1-486
  policy: PRESERVED_FROM_C1_06R1
parent_test_vector:
  path: C1_07R1_CONTRACT_TEST_VECTOR_CANDIDATE__sha256_fbca2f7e1cd3df5a6d9501a60c775fa5618c636935d1809d9dc358c7819ea35c.yaml
  sha256: fbca2f7e1cd3df5a6d9501a60c775fa5618c636935d1809d9dc358c7819ea35c
semantic_validator_contract:
  C1.SEM.SUCCESSOR_DISTINCT_ENDPOINTS:
    input_schema_def: SuccessorDistinctEndpointValidationInput
    owner: C1
    rule: PREDECESSOR_OF target and related_target must have different canonical refs.
    error_code: PREDECESSOR_SUCCESSOR_SELF_LOOP_FORBIDDEN
  C1.SEM.CONTRACT_PARENT_DERIVATIVE_PRODUCT:
    input_schema_def: ContractParentKindValidationInput
    owner: C1
    rule: contract_record.parent_instrument_ref must equal parent_instrument_record.ref,
      and parent_instrument_record.instrument_kind must equal DERIVATIVE_PRODUCT.
    reference_mismatch_error: CONTRACT_PARENT_INSTRUMENT_REFERENCE_MISMATCH
    kind_mismatch_error: CONTRACT_PARENT_INSTRUMENT_KIND_MISMATCH
  C1.SEM.CONTRACT_PARENT_IMMUTABLE:
    input_schema_def: ContractParentTransitionValidationInput
    owner: C1
    rule: When before_record.ref == after_record.ref, parent_instrument_ref must be
      unchanged.
    error_code: CONTRACT_INSTRUMENT_REPARENT_FORBIDDEN
  C1.SEM.LISTING_PARENT_IMMUTABLE:
    input_schema_def: ListingParentTransitionValidationInput
    owner: C1
    rule: When before_record.ref == after_record.ref, both instrument_ref and venue_ref
      must be unchanged. Instrument mismatch -> LISTING_REPARENT_FORBIDDEN; venue
      mismatch -> LISTING_VENUE_REPARENT_FORBIDDEN.
    error_code: LISTING_REPARENT_FORBIDDEN
    venue_error_code: LISTING_VENUE_REPARENT_FORBIDDEN
  C1.SEM.CANONICAL_REPLACEMENT_PACKAGE:
    input_schema_def: CanonicalReplacementValidationInput
    owner: C1
    rule: old_ref and new_ref must be distinct and same-kind; termination targets
      old_ref, creation targets new_ref, and successor effect links old_ref -> new_ref.
    error_code: CANONICAL_ID_REUSE_FORBIDDEN
  C1.SEM.CURRENT_PIT_SAFE_HISTORICAL_REUSE:
    input_schema_def: CurrentPitSafeHistoricalReuseValidationInput
    owner: C1
    rule: CURRENT PIT_SAFE result cannot be reused as historical evidence unless an
      explicit C4 reconstruction-equivalence ref is present.
    error_code: CURRENT_ANCHOR_NOT_HISTORICAL_EVIDENCE
    classification: NON_BLOCKING_HARDENING
  C1.SEM.ACTIVE_CONTRACT_VENUE_ADMISSION_UNIQUENESS:
    input_schema_def: ActiveContractVenueAdmissionSetValidationInput
    owner: C1
    rule: Within the active_admissions set supplied by C4 for one state_ref, no duplicate
      (contract_ref, listing_ref) endpoint tuple is permitted.
    error_code: DUPLICATE_CONTRACT_VENUE_ADMISSION
    classification: NON_BLOCKING_HARDENING
    ownership_boundary: C4 determines active membership at state_ref; C1 validates
      endpoint uniqueness; C11 owns persistence/idempotent coalescing.
  C1.SEM.LISTING_VENUE_TRANSFER_PACKAGE:
    input_schema_def: ListingVenueTransferValidationInput
    owner: C1
    rule: 'Cross-canonical-Venue transfer requires: same InstrumentID; distinct old/new
      ListingIDs; distinct old/new VenueIDs; termination targets old ListingID; creation
      targets new ListingID; PREDECESSOR_OF successor links old ListingID to new ListingID.'
    instrument_mismatch_error: LISTING_VENUE_TRANSFER_INSTRUMENT_MISMATCH
    same_venue_error: LISTING_VENUE_TRANSFER_SAME_VENUE_FORBIDDEN
    same_id_error: CANONICAL_ID_REUSE_FORBIDDEN
    package_error: LISTING_VENUE_TRANSFER_PACKAGE_INVALID
    ownership_boundary: C1 owns Listing identity continuity. C4 owns effective timing/state.
      C11 owns persistence.
  C1.SEM.SAME_VENUE_LISTING_CONTINUITY:
    input_schema_def: SameVenueListingContinuityValidationInput
    owner: C1
    rule: Same ListingID is valid when instrument_ref and venue_ref are unchanged,
      even if non-identity tier/segment/display-label metadata changes.
    error_code: LISTING_REPARENT_FORBIDDEN
    ownership_boundary: Tier/segment/display-label metadata does not redefine canonical
      Venue identity unless a separate passed contract says the canonical VenueID
      itself changed.
