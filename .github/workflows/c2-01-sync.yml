name: C2.01 exact governance sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c2-01-sync.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact content-addressed C2.01 artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p governance/C2/C2.01
          cat .c2-01-sync/registry.part00 .c2-01-sync/registry.part01 .c2-01-sync/registry.part02 .c2-01-sync/registry.part03 .c2-01-sync/registry.part04 > governance/C2/C2.01/C2_01_PROVIDER_CAPABILITY_ENDPOINT_SEMANTIC_REGISTRY_CANDIDATE__sha256_12e3ade1031d1e608ff31ebea0b58d9c8505ea36533e624f8a4af82f0794961a.md
          cat .c2-01-sync/ledger.part00 .c2-01-sync/ledger.part01 .c2-01-sync/ledger.part02 > governance/C2/C2.01/C2_01_EVIDENCE_DECISION_LEDGER_CANDIDATE__sha256_de64fd89c75cf24e56011ec4219a1967dc2de2b89b17ffd8d9516d6e48ba7ffc.yaml
          echo '12e3ade1031d1e608ff31ebea0b58d9c8505ea36533e624f8a4af82f0794961a  governance/C2/C2.01/C2_01_PROVIDER_CAPABILITY_ENDPOINT_SEMANTIC_REGISTRY_CANDIDATE__sha256_12e3ade1031d1e608ff31ebea0b58d9c8505ea36533e624f8a4af82f0794961a.md' | sha256sum -c -
          echo 'de64fd89c75cf24e56011ec4219a1967dc2de2b89b17ffd8d9516d6e48ba7ffc  governance/C2/C2.01/C2_01_EVIDENCE_DECISION_LEDGER_CANDIDATE__sha256_de64fd89c75cf24e56011ec4219a1967dc2de2b89b17ffd8d9516d6e48ba7ffc.yaml' | sha256sum -c -
      - name: Commit exact artifacts and remove temporary sync machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'XXHANOO'
          git config user.email 'stevexie.0ah@outlook.com'
          rm -rf .c2-01-sync
          rm -f .github/workflows/c2-01-sync.yml
          git add -A
          git commit -m 'governance(C2.01): archive exact construction candidate'
          git push origin HEAD:main
