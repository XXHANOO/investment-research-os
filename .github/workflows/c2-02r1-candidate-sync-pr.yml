name: C2.02R1 candidate exact-byte sync PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.c2-02r1-sync/**'

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'governance/c2-02r1-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconstruct and verify C2.02R1 repair candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/c2r1
          cat .c2-02r1-sync/chunk*.b64 | tr -d '\n' | base64 -d > /tmp/c2r1/transport.tar.gz
          mkdir -p /tmp/c2r1/extracted
          tar -xzf /tmp/c2r1/transport.tar.gz -C /tmp/c2r1/extracted

          count=$(find /tmp/c2r1/extracted -maxdepth 1 -type f | wc -l | tr -d ' ')
          test "$count" = "11"

          for f in /tmp/c2r1/extracted/*; do
            bn=$(basename "$f")
            expected=$(printf '%s' "$bn" | sed -n 's/.*__sha256_\([0-9a-f]\{64\}\)\..*/\1/p')
            test -n "$expected"
            actual=$(sha256sum "$f" | awk '{print $1}')
            test "$actual" = "$expected"
          done

          rm -rf governance/C2/C2.02R1
          mkdir -p governance/C2/C2.02R1
          cp /tmp/c2r1/extracted/* governance/C2/C2.02R1/

          for f in governance/C2/C2.02R1/*; do
            bn=$(basename "$f")
            expected=$(printf '%s' "$bn" | sed -n 's/.*__sha256_\([0-9a-f]\{64\}\)\..*/\1/p')
            actual=$(sha256sum "$f" | awk '{print $1}')
            test "$actual" = "$expected"
          done

          rm -rf .c2-02r1-sync
      - name: Commit exact C2.02R1 repair candidate to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add governance/C2/C2.02R1 .c2-02r1-sync
          git commit -m 'governance(C2.02R1): materialize exact scoped repair candidate'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
