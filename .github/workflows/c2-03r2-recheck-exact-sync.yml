name: C2.03R2 independent re-check exact-byte sync

on:
  pull_request:
    branches: [main]
    paths:
      - '.c2-03r2-recheck-sync/**'
      - '.github/workflows/c2-03r2-recheck-exact-sync.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct and verify exact review artifacts
        shell: bash
        run: |
          set -euo pipefail
          cat .c2-03r2-recheck-sync/chunk00.b64 .c2-03r2-recheck-sync/chunk01.b64 .c2-03r2-recheck-sync/chunk02.b64 | base64 -d > /tmp/c2-03r2-recheck.zip
          echo '95ffb114bfc957bb596ec50097f6a15141f1ccfc2594101f2b093b981c3d2d11  /tmp/c2-03r2-recheck.zip' | sha256sum -c -
          rm -rf /tmp/c2-03r2-recheck && mkdir -p /tmp/c2-03r2-recheck
          unzip -q /tmp/c2-03r2-recheck.zip -d /tmp/c2-03r2-recheck
          test "$(find /tmp/c2-03r2-recheck -maxdepth 1 -type f | wc -l)" -eq 2
          REPORT='C2_03R2_INDEPENDENT_ROUTING_RECHECK_REPORT__sha256_968db1fb83eca0e77c51a017ec12c5bcb5e43440cd0a25a7e971b9c00f5ef11a.md'
          RESULT='C2_03R2_INDEPENDENT_ROUTING_RECHECK_RESULT__sha256_f8db42b0dce59cb021dfa12f5913fb3f79918808d73f5fbc853656a8b7633d43.yaml'
          test -f "/tmp/c2-03r2-recheck/$REPORT"
          test -f "/tmp/c2-03r2-recheck/$RESULT"
          echo '968db1fb83eca0e77c51a017ec12c5bcb5e43440cd0a25a7e971b9c00f5ef11a  /tmp/c2-03r2-recheck/'"$REPORT" | sha256sum -c -
          echo 'f8db42b0dce59cb021dfa12f5913fb3f79918808d73f5fbc853656a8b7633d43  /tmp/c2-03r2-recheck/'"$RESULT" | sha256sum -c -
          mkdir -p governance/C2/C2.03R2
          cp "/tmp/c2-03r2-recheck/$REPORT" governance/C2/C2.03R2/
          cp "/tmp/c2-03r2-recheck/$RESULT" governance/C2/C2.03R2/
          echo '968db1fb83eca0e77c51a017ec12c5bcb5e43440cd0a25a7e971b9c00f5ef11a  governance/C2/C2.03R2/'"$REPORT" | sha256sum -c -
          echo 'f8db42b0dce59cb021dfa12f5913fb3f79918808d73f5fbc853656a8b7633d43  governance/C2/C2.03R2/'"$RESULT" | sha256sum -c -
          rm -rf .c2-03r2-recheck-sync
          rm -f .github/workflows/c2-03r2-recheck-exact-sync.yml

      - name: Commit exact review artifacts and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit(C2.03R2): archive exact independent routing re-check PASS'
          git push origin HEAD:${{ github.head_ref }}
