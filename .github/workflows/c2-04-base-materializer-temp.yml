name: C2.04 temporary base materializer

on:
  pull_request:
    paths:
      - '.c2-04-sync/**'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and verify exact C2.04 candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .c2-04-sync/chunk00.b64 .c2-04-sync/chunk01.b64 .c2-04-sync/chunk02.b64 | base64 -d > /tmp/c2_04_candidate_transport.zip
          test "$(sha256sum /tmp/c2_04_candidate_transport.zip | awk '{print $1}')" = "528d5c7ef8c651de0b7c66a755671317625360747779cae363cd9ed24f2acc0c"
          rm -rf /tmp/c2_04_extract
          mkdir -p /tmp/c2_04_extract
          unzip -qq /tmp/c2_04_candidate_transport.zip -d /tmp/c2_04_extract
          find /tmp/c2_04_extract -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
C2_04_ACCEPTANCE_TEST_DELTA_CANDIDATE__sha256_2a0b24c0f9d67a03c565f16e2985d0a5ecbaaff090c4715b2b7ea9b8491c0b8a.md
C2_04_CANDIDATE_SELECTION__sha256_43ed6936cf36435303edd0a4df2847da1af10816d2b51e431b8885496eba60f4.yaml
C2_04_CONSTRUCTION_SUMMARY__sha256_69008bf5827bf300b77b0a3fa003faca9ce96766913d69470413f49eb6e60dd8.json
C2_04_CONSTRUCTION_VALIDATION__sha256_6a6c45ae2d9785a81f130b5142361d125ad40cb499962517d320f379200b176c.json
C2_04_CREDENTIAL_PRIVATE_STATE_SECURE_INGRESS_CONTRACT_CANDIDATE__sha256_198d194fbb3814676f1cb74aec5d56f19f8b1f9b081c6d77c16b4e66fd762cda.md
C2_04_EVIDENCE_DECISION_LEDGER_CANDIDATE__sha256_719018dd73c1e80e9633d0468972e253dae4f77a3ffda75e1c0169c16c9aeac4.yaml
C2_04_INDEPENDENT_SECURITY_REVIEW_PACKAGE_MANIFEST__sha256_e3495ee44dd266fdaf9fbd2f5d9f3cb0f1e361f578c284b822fe8f9d512c5b28.yaml
C2_04_INDEPENDENT_SECURITY_REVIEW_PACKAGE_ZIP_POINTER__sha256_5b09444eed4c7eb63e966026df1642397558f9f36b52c1c019fc9c7d61eb8e74.txt
C2_04_SECURITY_BOUNDARY_LOGICAL_MODEL_CANDIDATE__sha256_9d3609c775967fe374c1e1007828540d893852834bece09986148bf5a8aad5af.yaml
C2_04_STAGE_REPORT__sha256_afd19deeaeafd98ae9e10fa0c6ba953e4c8a2008dcc5652cab3c054f7619a55f.md
EOF
          diff -u /tmp/expected.txt /tmp/actual.txt
          mkdir -p governance/C2/C2.04
          while IFS= read -r name; do
            expected_sha="$(printf '%s\n' "$name" | sed -n 's/.*__sha256_\([0-9a-f]\{64\}\)\..*/\1/p')"
            test -n "$expected_sha"
            test "$(sha256sum "/tmp/c2_04_extract/$name" | awk '{print $1}')" = "$expected_sha"
            cp "/tmp/c2_04_extract/$name" "governance/C2/C2.04/$name"
            test "$(sha256sum "governance/C2/C2.04/$name" | awk '{print $1}')" = "$expected_sha"
          done < /tmp/expected.txt
          rm -rf .c2-04-sync
          rm -f .github/workflows/c2-04-exact-sync.yml

      - name: Commit exact canonical candidate to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "governance(C2.04): archive exact security-boundary candidate"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
