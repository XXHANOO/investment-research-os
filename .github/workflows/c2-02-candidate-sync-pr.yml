name: C2.02 candidate exact-byte sync PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'governance/c2-02-construction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Reconstruct and verify C2.02 candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, tarfile, re

          expected = {
            'C2_02_ACCEPTANCE_TEST_DELTA_CANDIDATE__sha256_2d8233a17fa2ad2afc0ff386e4975869d138bfafdf7025a17eb2be5556fb10ed.md',
            'C2_02_CANDIDATE_SELECTION__sha256_443d707a20e5c833741f5ca9c95d02d700185a560b0fba22bcd36cc787f887f6.yaml',
            'C2_02_CONSTRUCTION_SUMMARY__sha256_8687dba5ae04ecf9bfedf75e323dcc23dfaa686b998200832d6ae9503bc5f95c.json',
            'C2_02_CONSTRUCTION_VALIDATION__sha256_d9c02726bbea85edc903c9830e28f3ae4df6b590a348b421ef629e19b0503778.json',
            'C2_02_EVIDENCE_DECISION_LEDGER_CANDIDATE__sha256_9a84cda469a79b9f807a45514744fd6b905fe88ca0607ef3fd25f2b6bcd0f5ae.yaml',
            'C2_02_INDEPENDENT_OUTCOME_SEMANTICS_REVIEW_PACKAGE_ZIP_POINTER__sha256_a4675d42fddcc2be8e321672c52d1e39e56aad8c160f252c685e0fc0c0a545fa.txt',
            'C2_02_REVIEW_PACKAGE_MANIFEST__sha256_2f11f4489b9e3f782df3e2acf519ab54f129d323284eb96788eb445f7ed84bac.yaml',
            'C2_02_STAGE_REPORT__sha256_5843e6911aed97cfc7df011221ddf1472e3f188a31e6771793f2b0851249bf6a.md',
            'C2_02_TYPED_PROVIDER_OPERATION_DATA_OUTCOME_CONTRACT_CANDIDATE__sha256_eb7636409e2dcdfe688a089c0dabceacd300ad8dee49febfbc6cdc149b96d7ef.md',
            'C2_02_TYPED_PROVIDER_OUTCOME_LOGICAL_MODEL_CANDIDATE__sha256_607d3839d66ab0cae9bf8192f38135dfdde05f112a1768d33360415cda229ed4.yaml',
          }
          chunks=sorted(Path('.c2-02-sync').glob('chunk*.b64'))
          assert len(chunks)==2, len(chunks)
          raw=base64.b64decode(''.join(p.read_text() for p in chunks))
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
            names=set(tf.getnames())
            assert names==expected, f'inventory mismatch: {names ^ expected}'
            out=Path('governance/C2/C2.02'); out.mkdir(parents=True,exist_ok=True)
            for name in sorted(names):
              assert '/' not in name and '..' not in name
              data=tf.extractfile(name).read()
              m=re.search(r'__sha256_([0-9a-f]{64})\.',name)
              assert m, name
              actual=hashlib.sha256(data).hexdigest()
              assert actual==m.group(1), f'{name}: {actual} != {m.group(1)}'
              dest=out/name; dest.write_bytes(data)
              assert hashlib.sha256(dest.read_bytes()).hexdigest()==m.group(1)
          PY
      - name: Commit exact C2.02 candidate to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .c2-02-sync
          git add governance/C2/C2.02
          git commit -m 'governance(C2.02): archive exact construction candidate'
          git push origin HEAD:${GITHUB_HEAD_REF}
